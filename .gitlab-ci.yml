stages:
  - prepare
  - build
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  ISO_NAME: "live-image-amd64.hybrid.iso"

prepare:
  stage: prepare
  script:
    - sudo apt-get update
    - sudo apt-get install -y --no-install-recommends git ca-certificates make wget
    - git config --global init.defaultBranch master
    - git config --global user.email "ci@quenva.org"
    - git config --global user.name "Quenva CI"
    - git describe || git tag v0.0.0
    - sudo make download_extra
  artifacts:
    paths:
      - config/includes.chroot/
    expire_in: 1 day

build-iso:
  stage: build
  needs: ["prepare"]
  variables:
    RELEASE_NAME: "quenva-linux-${CI_COMMIT_REF_NAME}-amd64.iso"
  script:
    - sudo apt-get update
    - sudo apt-get install -y --no-install-recommends git ca-certificates live-build make
    - git config --global init.defaultBranch master
    - git config --global user.email "ci@quenva.org"
    - git config --global user.name "Quenva CI"
    - sudo mkdir -p chroot
    - git describe || git tag v0.0.0
    - sed -i 's/sudo //g' Makefile
    - sudo lb clean --all || true
    - sudo make clean
    - sudo make build
    - if [ -f "$ISO_NAME" ]; then sudo mv "$ISO_NAME" "$RELEASE_NAME"; fi
    - sudo sha256sum "$RELEASE_NAME" | sudo tee "$RELEASE_NAME.sha256"
    - sudo chown -R $(id -u):$(id -g) .
  artifacts:
    paths:
      - $RELEASE_NAME
      - $RELEASE_NAME.sha256
    expire_in: 7 days

release:
  stage: release
  needs:
    - job: build-iso
      artifacts: true
  only:
    - tags
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    name: "Quenva Linux $CI_COMMIT_TAG"
    description: |
      Quenva Linux $CI_COMMIT_TAG Release

      Run Free. Stay Sharp.
    tag_name: $CI_COMMIT_TAG
    assets:
      files:
        - path: quenva-linux-$CI_COMMIT_TAG-amd64.iso
          type: application/octet-stream
        - path: quenva-linux-$CI_COMMIT_TAG-amd64.iso.sha256
          type: text/plain