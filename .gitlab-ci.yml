image: ubuntu:22.04

variables:
  DEBIAN_FRONTEND: noninteractive
  ISO_NAME: "live-image-amd64.hybrid.iso"
  RELEASE_NAME: "quenva-linux-${CI_COMMIT_TAG:-$(date +%Y%m%d)}-amd64.iso"

stages:
  - prepare
  - build
  - release

.setup_base: &setup_base
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - git config --global init.defaultBranch master
    - git config --global user.email "ci@quenva.org"
    - git config --global user.name "Quenva CI"

prepare:
  stage: prepare
  <<: *setup_base
  script:
    - apt-get install -y --no-install-recommends make wget
    - git describe || git tag v0.0.0  # Ensure git describe works
    - make download_extra
  artifacts:
    paths:
      - config/includes.chroot/
    expire_in: 1 day
  interruptible: true

build-iso:
  stage: build
  <<: *setup_base
  needs:
    - prepare
  script:
    - apt-get install -y --no-install-recommends live-build make
    # Ensure git describe works
    - git describe || git tag v0.0.0
    # Remove sudo from Makefile commands
    - sed -i 's/sudo //g' Makefile
    # Build ISO
    - lb clean --all || true  # Ignore errors on first clean
    - make clean
    - make build
    # Rename the ISO for release
    - if [ -f "${ISO_NAME}" ]; then mv "${ISO_NAME}" "${RELEASE_NAME}"; fi
    - sha256sum "${RELEASE_NAME}" > "${RELEASE_NAME}.sha256"
  artifacts:
    paths:
      - ${RELEASE_NAME}
      - ${RELEASE_NAME}.sha256
    expire_in: 1 week
  interruptible: true

release:
  stage: release
  <<: *setup_base
  needs:
    - build-iso
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get install -y --no-install-recommends curl jq
    # Create release
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --data '{
             "name": "Quenva Linux '"${CI_COMMIT_TAG}"'",
             "tag_name": "'"${CI_COMMIT_TAG}"'",
             "description": "Quenva Linux '"${CI_COMMIT_TAG}"' Release\n\nRun Free. Stay Sharp."
           }' \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
    # Upload ISO and checksum
    - |
      for file in ${RELEASE_NAME}*; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/quenva-linux/${CI_COMMIT_TAG}/${file}"
      done
  artifacts:
    paths:
      - ${RELEASE_NAME}
      - ${RELEASE_NAME}.sha256
