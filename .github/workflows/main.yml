name: Build and Release Quenva Linux

on:
  push:
    branches: [ "**" ]
    tags: [ "*" ]

env:
  DEBIAN_FRONTEND: noninteractive
  ISO_NAME: "live-image-amd64.hybrid.iso"

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release-name: ${{ steps.set-release-name.outputs.RELEASE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates
          git config --global init.defaultBranch master
          git config --global user.email "ci@quenva.org"
          git config --global user.name "Quenva CI"

      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends make wget

      - name: Ensure git describe works
        run: git describe || git tag v0.0.0

      - name: Upload includes.chroot
        uses: actions/upload-artifact@v4
        with:
          name: includes.chroot
          path: config/includes.chroot/
          retention-days: 1

  build-iso:
    runs-on: ubuntu-22.04
    needs: prepare
    env:
      RELEASE_NAME: ${{ github.ref_name && format('quenva-linux-{0}-amd64.iso', github.ref_name) || format('quenva-linux-{0}-amd64.iso', github.run_id) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates
          git config --global init.defaultBranch master
          git config --global user.email "ci@quenva.org"
          git config --global user.name "Quenva CI"

      - name: Download includes.chroot
        uses: actions/download-artifact@v4
        with:
          name: includes.chroot
          path: config/includes.chroot/

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends live-build make
          sudo mkdir -p chroot

      - name: Prepare build environment
        run: |
          git describe || git tag v0.0.0
          sed -i 's/sudo //g' Makefile

      - name: Clean build (with sudo)
        run: |
          sudo lb clean --all || true
          sudo make clean

      - name: Build ISO (with sudo)
        run: sudo make build

      - name: Fix file permissions
        run: sudo chown -R runner:runner .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ env.RELEASE_NAME }}
          retention-days: 7
  release:
    runs-on: ubuntu-22.04
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates
          git config --global init.defaultBranch master
          git config --global user.email "ci@quenva.org"
          git config --global user.name "Quenva CI"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Create release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Quenva Linux ${{ github.ref_name }}
          body: |
            Quenva Linux ${{ github.ref_name }} Release

            Run Free. Stay Sharp.
          draft: false
          prerelease: false

      - name: Upload ISO asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./live-image-amd64.hybrid.iso
          asset_name: quenva.iso
          asset_content_type: application/octet-stream
